
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model 3D</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body{
      margin:0;
      background:#ffffff;
      font-family:Arial,sans-serif;
    }

    h1{
      text-align:center;
      padding:15px;
    }

    model-viewer{
      width:100%;
      height:80vh;
    }
  </style>
</head>

<body>

<h1>Model 3D Saya</h1>

<model-viewer
  src="model.glb"
  camera-controls
  auto-rotate
  ar
  shadow-intensity="1"
  exposure="1.2">
</model-viewer>

</body>
</html>
